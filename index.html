<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อม Online</title>
	<script  language="JavaScript" type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <style>
        html,
        body {
			font-family:Verdana,sans-serif;
			font-size:15px;line-height:1.5,
			margin: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }
		html{overflow-x:hidden}
        iframe {
			
            width: 100%;
            height: 100%;
        }
		

	  .topnav {
		overflow: hidden;
		background-color: #04AA6D;
		margin-bottom:5px;
	  }

	  #title{
	  height: 32px;
	  z-index: 2;
	  border-style:block;
	  background:#282A35;
	  margin:1px;
	  font-family: 'Source Sans Pro Topnav', sans-serif;
	  }
	  p.header1{
		color:#f2f2f2;
		font-size: 18px;
		text-align: center;
		text-decoration: none;
		}
	  .ols-block{
	  display:block;
	  height:125px;
	  padding-top: 0px;
	  padding-right: 3px;
	  padding-bottom: 0px;
	  padding-left: 0px;
	  margin-top:1px;
	  margin-left:2px;
	  margin-right:2px;
	  margin-bottom:3px;
	  color:#404040;
	  font-size:14px;
	  border-width: thin;
	  border: 1px solid green;
	  border-radius: 10px;
	  line-height: normal;
	  }
	  img{width:120px;height:inherit;
	  float:left;
	  margin-right:10px;
	  border-top-left-radius:10px;
	  border-bottom-left-radius:10px;
	  }
    </style>
</head>

<body>
	<script>
	    function readData(userId){
	        
		    let url = `https://script.google.com/macros/s/AKfycbweknkkTYaCVvMnxklz_3YIW_NyaXhbQ2rxqh2_rh_Da7Hl74sHi1naNwdY1vpym_AhYQ/exec?userId=${userId}&temp=history`;
		    /*$.getJSON(url, function(data) {
		    	console.log(data);
            });*/
            
            const output = document.querySelector('.output');
            
            fetch(url).then(rep => rep.json())
                .then((data) => {
                    console.log(data);
                    data.forEach((el) => {
                        // --- เพิ่มส่วนนี้เพื่อแปลง URL ---
					    let rawUrl = el.image1;
					    let directImageUrl = "";
					
					    if (rawUrl && rawUrl.includes('id=')) {
					        // กรณี URL มาแบบมี id=...
					        let id = rawUrl.split('id=')[1].split('&')[0];
					        directImageUrl = `https://drive.google.com/uc?export=view&id=${id}`;
					    } else if (rawUrl && rawUrl.includes('file/d/')) {
					        // กรณี URL มาแบบ file/d/XXXXX/view
					        let id = rawUrl.split('file/d/')[1].split('/')[0];
					        directImageUrl = `https://drive.google.com/uc?export=view&id=${id}`;
					    } else {
					        // ถ้าไม่ใช่ลิงก์ Google Drive หรือเป็นค่าว่าง
					        directImageUrl = rawUrl; 
					    }
					    // ----------------------------
					
					    let els = `
					        <div class="ols-block">							
					            <img src="${directImageUrl}" onerror="this.src='https://via.placeholder.com/120x120?text=No+Image'">
					            <p>วันที่แจ้ง: ${el.requestdate}</p>
					            <p>ปัญหา: ${el.request}</p>
					            <p>สถานะ: ${el.status}</p>
					        </div>`;
					    
					    output.insertAdjacentHTML('beforeend', els);
                        
                    })
            })
	    }
	</script>
    <div class="topnav">
        <p class="header1">ประวัติการแจ้งซ่อม</p>
    </div>
    <div class="output"></div>
	<!--<script>readData()</script>-->
</body>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    
    function runApp() {
        liff.getProfile().then(profile => {
            let userId = profile.userId;
            let displayName = profile.displayName;
            let pictureUrl = profile.pictureUrl;
         
			readData(userId);
			
			
        }).catch(err => console.error(err));
    }

    liff.init({ liffId: "1660940342-BrgAJ3QJ" }, () => {
        if (liff.isLoggedIn()) {
            runApp();
        } else {
            liff.login();
        }
    }, err => console.error(err.code, error.message));

</script>

</html>
